<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: sticky header with tabs, one-column ledger of rows that expand in place to an editor. */
:root {
  --bg: #eceef2;
  --surface: #f8f9fb;
  --surface-2: #e2e5ec;
  --ink: #181c2b;
  --mute: #5b6379;
  --line: #cdd2de;
  --accent: #0d6e7a;
  --on-accent: #ffffff;
  --st-dispo: #2b8556;
  --st-encours: #c4731d;
  --st-pasdispo: #c0443f;
  --st-pause: #8a7a22;
  --st-atrier: #6f50c8;
  --st-lu: #0d6e7a;
  --font-display: "Dela Gothic One", "Arial Black", "Helvetica Neue", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --surface-2: #262a37; --ink: #e8eaf2; --mute: #9aa1b8;
    --line: #333849; --accent: #4cc3d0; --on-accent: #0b1317;
    --st-dispo: #49b57c; --st-encours: #e59a49; --st-pasdispo: #e06b66; --st-pause: #c4b24f; --st-atrier: #a58cf0; --st-lu: #4cc3d0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --surface-2: #262a37; --ink: #e8eaf2; --mute: #9aa1b8;
  --line: #333849; --accent: #4cc3d0; --on-accent: #0b1317;
  --st-dispo: #49b57c; --st-encours: #e59a49; --st-pasdispo: #e06b66; --st-pause: #c4b24f; --st-atrier: #a58cf0; --st-lu: #4cc3d0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 14px 10px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.sync { font-size: .78rem; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); display: inline-block; }
.sync.ok i { background: var(--st-dispo); }
.sync.bad i { background: var(--st-pasdispo); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; font: inherit; font-weight: 500; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 7px; align-items: center;
}
.tab b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--mute); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] b { color: var(--bg); opacity: .75; }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 12px; }
.bar input[type=search] { flex: 1 1 200px; min-width: 0; }
input, select, textarea, button { font: inherit; color: var(--ink); }
input[type=search], input[type=text], input[type=number], input[type=email], input[type=password], input[type=date], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
}
.bar select { width: auto; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: var(--st-pasdispo); color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; display: grid; gap: 10px; }
.panel h2 { font-size: 1rem; margin: 0; }
.panel p { margin: 0; color: var(--mute); }
.row-add { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
@media (max-width: 520px) { .row-add { grid-template-columns: 1fr; } }
ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li.item { border-bottom: 1px solid var(--line); }
.head { width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 12px 2px; display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: center; }
.head .stripe { align-self: stretch; border-radius: 3px; background: var(--st); min-height: 28px; }
.title { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.title .star { color: var(--accent); margin-right: 4px; }
.sub { color: var(--mute); font-size: .82rem; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.sub .arret { color: var(--ink); }
.count { text-align: right; font-variant-numeric: tabular-nums; font-size: .85rem; white-space: nowrap; }
.count small { display: block; color: var(--mute); font-size: .72rem; }
.meter { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 4px; overflow: hidden; width: 84px; margin-left: auto; }
.meter span { display: block; height: 100%; background: var(--st); }
.head.hascover { grid-template-columns: 6px 44px 1fr auto; }
.cover { width: 44px; height: 62px; object-fit: cover; border-radius: 3px; background: var(--surface-2); display: block; }
li.group { padding: 16px 2px 6px; font-weight: 700; font-size: .85rem; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
li.group b { font-variant-numeric: tabular-nums; margin-left: 6px; }
a.btn { text-decoration: none; display: inline-block; }
.new { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 700; margin-left: 6px; white-space: nowrap; }
.stats { display: grid; gap: 18px; padding-block: 8px; }
.stats h2 { font-size: .85rem; margin: 0 0 8px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--mute); font-size: .8rem; }
.barrow { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 40px; gap: 10px; align-items: center; font-size: .88rem; padding-block: 3px; }
.barrow > span { overflow-wrap: anywhere; }
.bartrack { background: var(--surface-2); border-radius: 4px; height: 8px; overflow: hidden; }
.bartrack i { display: block; height: 100%; background: var(--st, var(--accent)); }
.barrow b { text-align: right; font-variant-numeric: tabular-nums; }
.lec { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 8px; font-size: .7rem; font-weight: 700; margin-left: 6px; white-space: nowrap; }
.hint { color: var(--mute); font-size: .82rem; margin: 6px 0 0; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.pick.nocover { grid-template-columns: minmax(0, 1fr); }
.pick .cover { width: 88px; height: 126px; }
.pick h3 { margin: 0; font-size: 1.15rem; font-family: var(--font-display); font-weight: 400; overflow-wrap: anywhere; }
.pick .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.dup { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; display: grid; gap: 8px; margin-bottom: 8px; }
.dup .m { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.dup .m > span { min-width: 0; overflow-wrap: anywhere; }
.dup small { color: var(--mute); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
.mainCol { min-width: 0; }
.side { order: -1; display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-block: 10px 2px; scrollbar-width: none; }
.side::-webkit-scrollbar { display: none; }
.side .lbl { flex: 0 0 auto; color: var(--mute); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
@media (min-width: 900px) {
  .wrap { max-width: 1040px; }
  .layout { grid-template-columns: minmax(0, 1fr) 210px; }
  .side { order: 0; flex-direction: column; align-items: stretch; overflow: visible; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 130px); align-self: start; padding-top: 14px; }
  .side .lbl { margin: 0 0 4px 2px; }
  .side .tab { justify-content: space-between; border-radius: 8px; padding: 8px 12px; }
}
@media (max-width: 899px) {
  header.top { position: static; }
  .tabs, .side { flex-wrap: wrap; overflow-x: visible; }
}
.lusfilter { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding-block: 4px 12px; }
.lusfilter label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.lusfilter b { color: var(--mute); font-variant-numeric: tabular-nums; }
.auth { max-width: 380px; margin: 0 auto; padding-block: 12vh 32px; display: grid; gap: 14px; }
.auth h1 { margin-bottom: 4px; }
.auth form { display: grid; gap: 10px; }
.auth label { display: grid; gap: 4px; font-size: .82rem; color: var(--mute); }
.auth .tools .btn { flex: 1 1 140px; }
#authMsg { margin: 0; min-height: 1.4em; color: var(--st-pasdispo); font-size: .88rem; }
.who { color: var(--mute); font-size: .78rem; overflow-wrap: anywhere; }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.filebtn { cursor: pointer; display: inline-block; text-align: center; }
.editor { padding: 4px 2px 16px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.editor label { display: grid; gap: 4px; font-size: .78rem; color: var(--mute); min-width: 0; }
.editor .wide { grid-column: 1 / -1; }
.readbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.readnow { color: var(--st-lu); font-weight: 700; margin-right: 4px; }
.editor .checks { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; color: var(--ink); font-size: .9rem; }
.editor .checks label { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: .9rem; }
.editor .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.empty { padding: 36px 8px; text-align: center; color: var(--mute); }
.note-banner { color: var(--st-pasdispo); font-size: .85rem; padding-block: 8px; }
footer { color: var(--mute); font-size: .8rem; padding-top: 22px; }
@media (prefers-reduced-motion: no-preference) { .meter span { transition: width .25s; } }
</style>
</head>

<div class="auth" id="authBox" hidden>
  <h1>Mangathèque</h1>
  <p class="hint">Connecte-toi pour retrouver ta bibliothèque sur tous tes appareils.</p>
  <form id="authForm">
    <label for="authEmail">E-mail<input type="email" id="authEmail" autocomplete="email" required></label>
    <label for="authPass">Mot de passe (6 caractères minimum)<input type="password" id="authPass" autocomplete="current-password" required></label>
    <div class="tools"><button class="btn" type="submit" id="authIn">Se connecter</button><button class="btn ghost" type="button" id="authSignup">Créer un compte</button></div>
    <p id="authMsg" role="status"></p>
  </form>
</div>

<div class="wrap" hidden>
  <header class="top">
    <div class="brand">
      <h1>Mangathèque</h1>
      <span class="sync" id="sync" role="status"><i></i><span id="syncTxt">Connexion…</span></span>
      <span class="who"><span id="who"></span> <button class="btn ghost small" id="logout" type="button">Se déconnecter</button></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Catégories"></nav>
  </header>

  <div class="layout">
  <div class="mainCol">
  <div class="bar">
    <input type="search" id="q" placeholder="Rechercher un manga" aria-label="Rechercher">
    <select id="sort" aria-label="Trier">
      <option value="az">A → Z</option>
      <option value="tomes">Plus de tomes</option>
      <option value="retard">Reste à lire (dispo)</option>
      <option value="note">Meilleure note</option>
      <option value="recent">Lus récemment</option>
    </select>
    <select id="genre" aria-label="Genre"><option value="">Tous les genres</option></select>
    <button class="btn ghost" id="pickBtn" type="button">Au hasard</button>
    <button class="btn" id="addToggle" type="button">Ajouter</button>
  </div>

  <div class="lusfilter" id="lusFilter" hidden>
    <label><input type="checkbox" id="fRated" checked> Notés <b id="nRated"></b></label>
    <label><input type="checkbox" id="fUnrated" checked> Non notés <b id="nUnrated"></b></label>
  </div>

  <div id="banner"></div>

  <form class="panel" id="addPanel" hidden>
    <h2>Nouveau manga</h2>
    <div class="row-add">
      <input type="text" id="addName" placeholder="Titre" aria-label="Titre" autocomplete="off">
      <select id="addStatus" aria-label="Catégorie"></select>
      <button class="btn" type="submit">Ajouter</button>
    </div>
  </form>

  <div id="pickBox" hidden></div>
  <div id="importBox" hidden></div>
  <div class="stats" id="statsBox" hidden></div>
  <datalist id="genreList"><option value="shonen"><option value="seinen"><option value="shojo"><option value="josei"><option value="action"><option value="aventure"><option value="fantasy"><option value="horreur"><option value="thriller"><option value="psychologique"><option value="science-fiction"><option value="sport"><option value="romance"><option value="comédie"><option value="tranche de vie"><option value="historique"><option value="isekai"></datalist>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden></div>
  </div>
  <aside class="side" id="side" aria-label="Ma liste"></aside>
  </div>

  <footer>
    Tes données sont enregistrées sur ton compte et synchronisées entre tes appareils.
  </footer>
</div>

function dupGroups() {
  const arr = [...items.values()];
  const keys = arr.map((i) => norm(i.name).replace(/[^a-z0-9]+/g, ""));
  const parent = arr.map((_, i) => i);
  const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const bg = (s) => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const grams = keys.map(bg);
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = keys[i], b = keys[j];
      if (!a || !b) continue;
      if (a === b) { parent[find(i)] = find(j); continue; }
      if (Math.abs(a.length - b.length) > 1) continue;
      if ((/\d/.test(a) || /\d/.test(b)) && a.replace(/\D/g, "") !== b.replace(/\D/g, "")) continue;
      let inter = 0;
      grams[i].forEach((n, g) => { const m = grams[j].get(g); if (m) inter += Math.min(n, m); });
      if ((2 * inter) / (a.length + b.length - 2) >= 0.9) parent[find(i)] = find(j);
    }
  }
  const groups = {};
  arr.forEach((it, i) => { const r = find(i); (groups[r] = groups[r] || []).push(it); });
  return Object.values(groups).filter((g) => g.length > 1).map((g) => g.sort((a, b) => a.id.localeCompare(b.id)));
}

function resizeCover(file) {

    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;

  genreSig = sig;
  if (genreFilter && !gs.includes(genreFilter)) genreFilter = "";
  $("genre").innerHTML = '<option value="">Tous les genres</option>' + gs.map((g) => `<option value="${esc(g)}"${g === genreFilter ? " selected" : ""}>${esc(g)}</option>`).join("");
}
function bars(rows) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return rows.map(([l, n, c]) => `<div class="barrow"><span>${esc(l)}</span><div class="bartrack"><i style="width:${(n / max) * 100}%;--st:${c || "var(--accent)"}"></i></div><b>${n}</b></div>`).join("");
}
function statsHTML() {
  const all = [...items.values()];
  const lus = all.filter((i) => i.lu === true);
  const arret = lus.filter((i) => i.status === "pause").length;
  const rated = all.filter((i) => typeof i.rating === "number");
  const avg = rated.length ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1).replace(".", ",") : "–";
  const tomesRef = all.reduce((s, i) => s + (typeof i.tomes === "number" ? i.tomes : 0), 0);
  const tomesLus = all.reduce((s, i) => s + (typeof i.tomeLu === "number" ? i.tomeLu : 0), 0);
  const finis = lus.length - arret;
  const tomesDispo = all.filter((i) => i.status === "dispo" || i.status === "encours").reduce((s, i) => s + (typeof i.avail === "number" ? i.avail : (typeof i.tomes === "number" ? i.tomes : 0)), 0);
  const longues = all.filter((i) => typeof i.tomes === "number").sort((a, b) => b.tomes - a.tomes).slice(0, 8).map((i) => [i.name, i.tomes]);
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  const cats = Object.keys(STATUS).map((k) => [STATUS[k], all.filter((i) => i.status === k && i.lu !== true).length, `var(--st-${k})`]);
  cats.push(["Lus", lus.length, "var(--st-lu)"]);
  const gc = {};
  all.forEach((i) => String(i.genres || "").split(",").forEach((g) => { g = g.trim().toLowerCase(); if (g) gc[g] = (gc[g] || 0) + 1; }));
  const topG = Object.entries(gc).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const reprendre = all.filter((i) => inTab(i, "reprendre")).length;
  return `<div class="stat-grid">${stat(all.length, "mangas au total")}${stat(lus.length, "lus")}${stat(finis, "finis à 100 %")}${stat(arret, "arrêtés en route")}${stat(reprendre, "à reprendre")}${stat(tomesRef, "tomes référencés")}${stat(tomesDispo, "tomes dispo sur ton site")}${stat(tomesLus || "–", "tomes lus (renseignés)")}${stat(avg, "note moyenne (" + rated.length + " notés)")}${stat(all.filter((i) => i.lu === true && String(i.dateLu || "").startsWith(String(new Date().getFullYear()))).length, "lus en " + new Date().getFullYear())}${stat(all.filter((i) => i.status !== "pasdispo" && !coverOf(i)).length, "sans couverture")}</div>
    <div><h2>Par catégorie</h2>${bars(cats)}</div>
    <div><h2>Séries les plus longues (tomes)</h2>${bars(longues)}</div>
    <div><h2>Genres les plus présents</h2>${topG.length ? bars(topG.map(([g, n]) => [g, n])) : '<p class="empty">Renseigne les genres dans les fiches pour les voir ici.</p>'}</div>
    <div><h2>Lus par année</h2>${yearsHTML(all)}</div>
    ${dupHTML()}
    <div><h2>Sauvegarde</h2>${exportHTML()}</div>`;
}

function renderTabs() {
  const all = [...items.values()];
  const mk = (t) => {

    return `<button class="tab" role="tab" type="button" data-tab="${t}" aria-selected="${t === tab}">${TAB_LABEL[t]} ${t === "stats" ? "" : `<b>${n}</b>`}</button>`;

function countHTML(it) {
  const st = `var(--st-${it.status})`;
  if (it.tomes != null && it.avail != null) {
    const pct = Math.min(100, Math.round((it.avail / it.tomes) * 100));
    return `<div class="count">${it.avail}/${it.tomes} tomes<div class="meter" style="--st:${st}"><span style="width:${pct}%"></span></div></div>`;
  }
  if (it.tomes != null) return `<div class="count">${it.tomes} tome${it.tomes > 1 ? "s" : ""}</div>`;
  if (it.chap != null) return `<div class="count">${it.chap} chap.</div>`;
  return `<div class="count"><small>à renseigner</small></div>`;
}

    <label>Ma note sur 10<input type="number" min="0" max="10" step="0.5" inputmode="decimal" data-f="rating" value="${esc(num(it.rating))}"${dis}></label>
    <label class="wide">Genres, séparés par des virgules<input type="text" list="genreList" data-f="genres" value="${esc(it.genres || "")}" placeholder="ex. shonen, action"${dis}></label>

    <div class="wide readbar">${it.lu

      : `${it.reading ? `<button type="button" class="btn ghost" data-act="lec-off"${dis}>Arrêter la lecture</button>` : `<button type="button" class="btn ghost" data-act="lec-on"${dis}>En train de lire</button>`}<button type="button" class="btn" data-act="lu-fini"${dis}>Lu, fini à 100 %</button><button type="button" class="btn ghost" data-act="lu-arret"${dis}>Lu, arrêté en cours de route</button>`}</div>
    <div class="wide checks">
      <label><input type="checkbox" data-f="star"${it.star ? " checked" : ""}${dis}> Marqué</label>
    </div>
    <div class="wide actions"><a class="btn ghost" href="${esc(/^https?:\/\//.test(it.url || "") ? it.url : "https://sushiscan.net/?s=" + encodeURIComponent(it.name))}" target="_blank" rel="noopener noreferrer">Ouvrir sur SushiScan</a>${it.cover ? `<button type="button" class="btn ghost" data-act="cover-del"${dis}>Retirer ma couverture</button>` : ""}${del}</div>

}

function itemHTML(it) {
  const st = `var(--st-${it.status})`;
  const subs = [];
  if (it.chap != null && it.tomes != null) subs.push(`${it.chap} chapitres`);
  if (it.arret) subs.push(`<span class="arret">Arrêté : ${esc(it.arret)}</span>`);
  if (typeof it.tomeLu === "number" && (it.tomes == null || it.tomeLu < it.tomes)) subs.push(`<span class="arret">Prochain : tome ${Math.floor(it.tomeLu) + 1}</span>`);
  if (typeof it.rating === "number") subs.push(`${it.rating}/10`);
  if (it.genres) subs.push(esc(it.genres));
  if (it.lu && it.dateLu) subs.push((it.status === "pause" ? "Arrêté le " : "Fini le ") + fmtDate(it.dateLu));
  const cv = coverOf(it);
  const newTome = typeof it.avail === "number" && typeof it.tomeLu === "number" && it.avail > it.tomeLu;
  if (it.note) subs.push(esc(it.note));
  const open = openId === it.id;
  return `<li class="item" style="--st:${st}">

      ${countHTML(it)}
    </button>

function render(fromSnap) {
  const ae = document.activeElement;
  if (fromSnap && ae && $("list").contains(ae) && ae.matches("input,textarea,select")) { renderTabs(); return; }
  renderTabs();
  syncGenre();
  const isStats = tab === "stats";
  $("statsBox").hidden = !isStats; if (isStats) $("lusFilter").hidden = true; $("pickBox").hidden = isStats || pickId == null; if (pickId != null && !isStats) renderPick(); $("list").hidden = isStats; document.querySelector(".bar").hidden = isStats;
  if (isStats) { try { $("statsBox").innerHTML = statsHTML(); } catch (err) { $("statsBox").innerHTML = `<p class="empty">Impossible d’afficher les stats : ${esc(err && err.message)}</p>`; } $("empty").hidden = true; renderImport(); return; }
  const nq = norm(q.trim());
  const hasGenre = (it) => String(it.genres || "").split(",").map((g) => g.trim().toLowerCase()).includes(genreFilter);
  let rows = [...items.values()].filter((it) => inTab(it, tab) && (!nq || norm(it.name).includes(nq)) && (!genreFilter || hasGenre(it)));
  $("lusFilter").hidden = tab !== "lu";
  if (tab === "lu") {
    const isRated = (it) => typeof it.rating === "number";
    $("nRated").textContent = rows.filter(isRated).length;
    $("nUnrated").textContent = rows.filter((it) => !isRated(it)).length;
    rows = rows.filter((it) => (isRated(it) ? showRated : showUnrated));
  }
  const byName = (a, b) => a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
  if (sort === "tomes") rows.sort((a, b) => (b.tomes || 0) - (a.tomes || 0) || byName(a, b));
  else if (sort === "note") rows.sort((a, b) => ((typeof b.rating === "number" ? b.rating : -1) - (typeof a.rating === "number" ? a.rating : -1)) || byName(a, b));
  else if (sort === "recent") rows.sort((a, b) => String(b.dateLu || "").localeCompare(String(a.dateLu || "")) || byName(a, b));
  else if (sort === "retard") rows.sort((a, b) => ((b.avail || 0) - (a.avail || 0)) || byName(a, b));
  else rows.sort(byName);
  if (tab === "lu") {
    const fin = rows.filter((it) => it.status !== "pause"), arr = rows.filter((it) => it.status === "pause");
    $("list").innerHTML =
      (arr.length ? `<li class="group">Arrêtés en cours de route <b>${arr.length}</b></li>` + arr.map(itemHTML).join("") : "") +
      (fin.length ? `<li class="group">Finis à 100 % <b>${fin.length}</b></li>` + fin.map(itemHTML).join("") : "");
  } else $("list").innerHTML = rows.map(itemHTML).join("");
  const empty = $("empty");
  if (!loaded) { empty.hidden = false; empty.textContent = "Chargement de ta bibliothèque…"; }
  else if (!rows.length) {
    empty.hidden = false;
    empty.textContent = items.size === 0 ? "Ta bibliothèque est vide. Ajoute un manga ou importe ta liste." : (nq ? "Aucun résultat pour cette recherche." : "Rien dans cette catégorie pour l’instant.");
  } else empty.hidden = true;
  renderImport();
}

let importMsgTxt = "";
function renderImport() {
  const box = $("importBox");
  const ready = loaded && flagsLoaded && db && canWrite;
  const need = ready && items.size === 0 && !flags.main;
  box.hidden = !(need || importing);
  if (box.hidden) return;
  box.innerHTML = `<div class="panel"><h2>Bienvenue dans ta mangathèque</h2>
    <p>Ta bibliothèque est vide. Choisis comment commencer.</p>
    <div class="tools"><button type="button" class="btn" id="startCatalog"${importing ? " disabled" : ""}>Partir du catalogue (${SEED.length} mangas)</button>
    <label class="btn ghost filebtn">Importer une sauvegarde<input type="file" id="startFile" accept=".json,application/json" hidden></label></div>
    <p id="importMsg" role="status">${esc(importMsgTxt)}</p></div>`;
}

async function runImport(list, kind) {
  if (importing || !col) return;
  importing = true; importMsgTxt = "Import en cours…"; renderImport();
  let failed = false;
  try {
    await col.setMany(list.map((it) => { const body = Object.assign({}, it); delete body.id; return { id: it.id, data: body }; }), (n) => {
      importMsgTxt = n + " / " + list.length; const m = $("importMsg"); if (m) m.textContent = importMsgTxt;
    });
  } catch (e) { failed = true; }
  importing = false; importMsgTxt = "";
  if (failed) $("banner").innerHTML = `<div class="note-banner">L’import a échoué. Recharge la page pour réessayer.</div>`;
  else if (kind) { flags = Object.assign({}, flags, { [kind]: true }); try { await db.doc("meta/imports").set(flags); } catch (e) {} }
  render();
}

function queue(id, fn) {
  const next = (chains[id] || Promise.resolve()).then(fn).catch((e) => {
    if (e && e.code === "invalid_argument") { canWrite = false; $("banner").innerHTML = `<div class="note-banner">Tu n’as pas le droit de modifier cette bibliothèque depuis cet appareil.</div>`; }
    else setSync("bad", "Échec de l’enregistrement");
  });
  chains[id] = next;
  return next;
}

function save(id, patch, now) {
  const it = items.get(id); if (!it) return;
  Object.assign(it, patch);
  pending[id] = Object.assign(pending[id] || {}, patch);
  clearTimeout(timers[id]);
  const flush = () => {
    const p = pending[id]; delete pending[id];
    if (!p || !col) return;
    setSync("", "Enregistrement…");
    queue(id, () => col.doc(id).update(p).then(() => setSync("ok", "Synchronisé")));
  };
  if (now) flush(); else timers[id] = setTimeout(flush, 500);
}

function parseNum(v) { if (v === "" || v == null) return null; const n = Number(v); return isFinite(n) ? n : null; }

/* events */

$("list").addEventListener("click", (e) => {
  const h = e.target.closest("[data-open]");
  if (h) { openId = openId === h.dataset.open ? null : h.dataset.open; confirmDel = null; render(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const id = a.closest(".editor").dataset.id;
  if (a.dataset.act === "lu-fini") { save(id, { lu: true, status: "dispo", reading: false, dateLu: today() }, true); render(); }
  else if (a.dataset.act === "lu-arret") { save(id, { lu: true, status: "pause", reading: false, dateLu: today() }, true); render(); }
  else if (a.dataset.act === "lu-non") { save(id, { lu: false, dateLu: "" }, true); render(); }
  else if (a.dataset.act === "lec-on") { save(id, { reading: true }, true); render(); }
  else if (a.dataset.act === "lec-off") { save(id, { reading: false }, true); render(); }
  else if (a.dataset.act === "cover-del") { save(id, { cover: "" }, true); render(); }
  else if (a.dataset.act === "del") { confirmDel = id; render(); }
  else if (a.dataset.act === "del-no") { confirmDel = null; render(); }
  else if (a.dataset.act === "del-yes") {
    items.delete(id); openId = null; confirmDel = null; render();
    if (col) queue(id, () => col.doc(id).delete().then(() => setSync("ok", "Synchronisé")));
  }
});
function onField(e, now) {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const id = e.target.closest(".editor").dataset.id;
  let v;
  if (f === "cat") {
    const cur = items.get(id), c = e.target.value;
    let patch;
    if (STATUS[c]) patch = { status: c, lu: false, reading: false };
    else if (c === "lecture") patch = (cur && cur.lu) ? { lu: false, reading: true, status: "encours" } : { lu: false, reading: true };
    else if (c === "reprendre") patch = { lu: true, status: "pause", reading: false, dateLu: (cur && cur.dateLu) || today() };
    else patch = { lu: true, status: "dispo", reading: false, dateLu: (cur && cur.dateLu) || today() };
    save(id, patch, true);
    render();
    return;
  }
  if (e.target.type === "checkbox") v = e.target.checked;
  else if (e.target.type === "number") v = parseNum(e.target.value);
  else v = e.target.value;
  save(id, { [f]: v }, now);
  if (now) render();
}
$("list").addEventListener("input", (e) => { if (e.target.type !== "checkbox" && e.target.tagName !== "SELECT") onField(e, false); });
$("list").addEventListener("change", (e) => { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onField(e, true); });
$("list").addEventListener("change", (e) => {
  const f = e.target;
  if (!f.dataset || !f.dataset.cover || !f.files || !f.files[0]) return;
  const id = f.closest(".editor").dataset.id;

});
$("statsBox").addEventListener("click", (e) => {

  const d = e.target.closest("[data-dup]");
  if (!d) return;
  const act = d.dataset.dup;
  if (act === "keep") dupConfirm = d.dataset.id;
  else if (act === "no") dupConfirm = null;
  else if (act === "yes") { mergeKeep(d.dataset.id); dupConfirm = null; }
  else if (act === "ignore") { try { const ig = JSON.parse(localStorage.getItem("dupIgnore") || "[]"); ig.push(d.closest(".dup").dataset.sig); localStorage.setItem("dupIgnore", JSON.stringify(ig)); } catch (err) {} }
  render();
});
$("pickBtn").addEventListener("click", pickRandom);
$("pickBox").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pick]");
  if (!b) return;
  if (b.dataset.pick === "again") { pickRandom(); return; }
  if (b.dataset.pick === "close") { pickId = null; render(); return; }

});
$("list").addEventListener("focusout", (e) => { const id = e.target.closest && e.target.closest(".editor") && e.target.closest(".editor").dataset.id; if (id && pending[id]) { clearTimeout(timers[id]); save(id, {}, true); } });

/* ---------- Supabase (appels directs, sans bibliothèque) ---------- */
const SB_URL = "https://dktcctnbbscbeapmiqgo.supabase.co";
const SB_KEY = "sb_publishable_fXKDvFbxnJjQkYN3nyjQkQ_2XCbCY3X";
const SESSION_KEY = "mgth_session";

const api = (function () {
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { session = null; }
  const store = (s) => { session = s; try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {} };
  const toSession = (j) => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } });
  const out = { onLost: null, current: () => session };

  async function authCall(path, body) {
    let r;
    try { r = await fetch(SB_URL + "/auth/v1/" + path, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
    catch (e) { const er = new Error("Impossible de joindre le serveur. Vérifie ta connexion."); er.network = true; throw er; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const er = new Error(j.msg || j.error_description || j.message || "Erreur de connexion"); er.status = r.status; er.errCode = j.error_code || j.code || ""; throw er; }
    return j;
  }
  out.signIn = async (email, password) => { store(toSession(await authCall("token?grant_type=password", { email, password }))); return session; };
  out.signUp = async (email, password) => { const j = await authCall("signup", { email, password }); if (j.access_token) { store(toSession(j)); return session; } return null; };
  out.signOut = () => store(null);

  let refreshing = null;
  async function token() {
    if (!session) { const e = new Error("auth"); e.code = "auth"; throw e; }
    if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
    if (!refreshing) refreshing = authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token }).then((j) => store(toSession(j))).finally(() => { refreshing = null; });
    try { await refreshing; }
    catch (e) {
      if (e.network) { const er = new Error(e.message); er.code = "unavailable"; throw er; }
      store(null); if (out.onLost) out.onLost(); const er = new Error("auth"); er.code = "auth"; throw er;
    }
    return session.access_token;
  }
  out.rest = async function (path, opts) {
    opts = opts || {};
    const tk = await token();
    let r;
    try {
      r = await fetch(SB_URL + "/rest/v1/" + path, {
        method: opts.method || "GET",
        headers: Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + tk, "Content-Type": "application/json" }, opts.headers || {}),
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
    } catch (e) { const er = new Error("réseau"); er.code = "unavailable"; throw er; }
    if (r.status === 401) { store(null); if (out.onLost) out.onLost(); const er = new Error("auth"); er.code = "auth"; throw er; }
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const er = new Error(j.message || "Erreur " + r.status);
      er.code = (r.status === 403 || j.code === "42501") ? "invalid_argument" : "unavailable";
      throw er;
    }
    if (r.status === 204) return null;
    return r.json().catch(() => null);
  };
  return out;
})();

/* Petite couche qui reprend le fonctionnement de la base utilisée par la page :
   un document par manga, des instantanés quand quelque chose change. */
function makeDb() {
  const cache = new Map();
  let listener = null, flagsRow = null, initial = null, lastTs = "", inflight = 0;

  const snap = (changes) => ({ docChanges: () => changes.map((c) => ({ type: c.type, doc: { id: c.id, exists: true, data: () => cache.get(c.id) } })), metadata: { fromCache: false } });
  const emit = (changes) => { if (listener && changes.length) listener(snap(changes)); };

  async function fetchAll() {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const part = await api.rest("mangas?select=id,data,updated_at&order=id&limit=1000&offset=" + from);
      rows.push(...(part || []));
      if (!part || part.length < 1000) break;
    }
    return rows;
  }
  function apply(rows, removeMissing) {
    const changes = [], seen = new Set();
    for (const r of rows) {
      if (r.updated_at && r.updated_at > lastTs) lastTs = r.updated_at;
      if (r.id === "__imports") { flagsRow = r.data || {}; continue; }
      seen.add(r.id);
      const next = r.data || {};
      if (!cache.has(r.id)) { cache.set(r.id, next); changes.push({ type: "added", id: r.id }); }
      else if (JSON.stringify(cache.get(r.id)) !== JSON.stringify(next)) { cache.set(r.id, next); changes.push({ type: "modified", id: r.id }); }
    }
    if (removeMissing) for (const id of [...cache.keys()]) if (!seen.has(id)) { cache.delete(id); changes.push({ type: "removed", id }); }
    return changes;
  }
  const ensureLoaded = () => initial || (initial = fetchAll().then((rows) => { apply(rows, true); }));

  async function refreshFull() { if (inflight || !initial) return; try { emit(apply(await fetchAll(), true)); } catch (e) {} }
  async function refreshIncremental() {
    if (inflight || !initial || !lastTs) return;
    try {
      const since = new Date(new Date(lastTs).getTime() - 120000).toISOString();
      emit(apply((await api.rest("mangas?select=id,data,updated_at&order=id&updated_at=gt." + encodeURIComponent(since))) || [], false));
    } catch (e) {}
  }
  setInterval(() => { if (!document.hidden) refreshIncremental(); }, 30000);
  setInterval(() => { if (!document.hidden) refreshFull(); }, 300000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshFull(); });

  async function upsert(rows) {
    inflight++;
    try {
      const ts = new Date().toISOString();
      await api.rest("mangas?on_conflict=user_id,id", {
        method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: rows.map((r) => ({ user_id: api.current().user.id, id: r.id, data: r.data, updated_at: ts })),
      });
      if (ts > lastTs) lastTs = ts;
    } finally { inflight--; }
  }

  const col = {
    doc(id) {
      return {
        async set(d) { const had = cache.has(id); cache.set(id, d); await upsert([{ id, data: d }]); emit([{ type: had ? "modified" : "added", id }]); },
        async update(patch) {
          if (!cache.has(id)) { const e = new Error("absent"); e.code = "invalid_argument"; throw e; }
          const next = Object.assign({}, cache.get(id), patch);
          cache.set(id, next); await upsert([{ id, data: next }]); emit([{ type: "modified", id }]);
        },
        async delete() {
          const had = cache.delete(id);
          inflight++;
          try { await api.rest("mangas?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: { Prefer: "return=minimal" } }); }
          finally { inflight--; }
          if (had) emit([{ type: "removed", id }]);
        },
      };
    },
    onSnapshot(next, error) {
      listener = next;
      ensureLoaded().then(() => next(snap([...cache.keys()].map((id) => ({ type: "added", id }))))).catch((e) => { initial = null; if (error) error(e); });
      return () => { listener = null; };
    },
    async replaceMany(entries) {
      for (let i = 0; i < entries.length; i += 100) {
        const chunk = entries.slice(i, i + 100);
        const had = chunk.map((e) => cache.has(e.id));
        chunk.forEach((e) => cache.set(e.id, e.data));
        await upsert(chunk);
        emit(chunk.map((e, k) => ({ type: had[k] ? "modified" : "added", id: e.id })));
      }
    },
    async setMany(entries, progress) {
      const fresh = entries.filter((e) => !cache.has(e.id));
      for (let i = 0; i < fresh.length; i += 100) {
        const chunk = fresh.slice(i, i + 100);
        chunk.forEach((e) => cache.set(e.id, e.data));
        try { await upsert(chunk); } catch (err) { chunk.forEach((e) => cache.delete(e.id)); throw err; }
        emit(chunk.map((e) => ({ type: "added", id: e.id })));
        if (progress) progress(Math.min(i + 100, fresh.length));
      }
    },
  };
  return {
    collection: () => col,
    doc: () => ({
      onSnapshot(next, error) { ensureLoaded().then(() => next({ exists: flagsRow != null, data: () => flagsRow })).catch((e) => { initial = null; if (error) error(e); }); return () => {}; },
      async set(d) { flagsRow = d; await upsert([{ id: "__imports", data: d }]); },
    }),
  };
}

/* ---------- connexion ---------- */
function showAuth(msg) {
  document.querySelector(".wrap").hidden = true;
  $("authBox").hidden = false;
  $("authMsg").textContent = msg || "";
}
function setAuthBusy(b) { $("authIn").disabled = b; $("authSignup").disabled = b; }
async function authSubmit(mode) {
  const email = $("authEmail").value.trim(), password = $("authPass").value;
  if (!email || password.length < 6) { $("authMsg").textContent = "Entre un e-mail et un mot de passe d’au moins 6 caractères."; return; }
  $("authMsg").textContent = "Un instant…"; setAuthBusy(true);
  try {
    const s = mode === "up" ? await api.signUp(email, password) : await api.signIn(email, password);
    if (s) startApp(s);
    else $("authMsg").textContent = "Compte créé. Ouvre l’e-mail de confirmation que tu viens de recevoir, puis connecte-toi.";
  } catch (e) {
    const m = String(e.message || "");
    $("authMsg").textContent = /invalid login|invalid_credentials/i.test(m + e.errCode) ? "E-mail ou mot de passe incorrect."
      : /already registered|user_already_exists/i.test(m + e.errCode) ? "Un compte existe déjà avec cet e-mail. Clique sur « Se connecter »."
      : /rate limit|over_email_send_rate_limit/i.test(m + e.errCode) ? "Trop d’essais. Réessaie dans quelques minutes."
      : /not confirmed|email_not_confirmed/i.test(m + e.errCode) ? "Confirme d’abord ton adresse avec l’e-mail reçu."
      : m || "Connexion impossible.";
  }
  setAuthBusy(false);
}
$("authForm").addEventListener("submit", (e) => { e.preventDefault(); authSubmit("in"); });
$("authSignup").addEventListener("click", () => authSubmit("up"));
$("logout").addEventListener("click", () => { api.signOut(); location.reload(); });
api.onLost = () => showAuth("Ta session a expiré. Reconnecte-toi.");

function startApp(session) {
  $("authBox").hidden = true;
  document.querySelector(".wrap").hidden = false;
  $("who").textContent = session.user.email;
  db = makeDb();
  col = db.collection("mangas");
  dl = true;
  db.doc("meta/imports").onSnapshot(
    (s) => { flags = s.exists ? (s.data() || {}) : {}; flagsLoaded = true; render(true); },
    () => { flags = { main: true }; flagsLoaded = true; render(true); }
  );
  const timer = setTimeout(() => { if (!loaded) setSync("bad", "Serveur injoignable pour l’instant"); }, 10000);
  col.onSnapshot((snap) => {
    snap.docChanges().forEach((c) => {
      if (c.type === "removed") items.delete(c.doc.id);
      else if (!pending[c.doc.id]) items.set(c.doc.id, Object.assign({ id: c.doc.id }, c.doc.data()));
    });
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync("ok", "Synchronisé"); }
    loaded = true; render(true);
  }, (err) => {
    clearTimeout(timer); loaded = true;
    setSync("bad", "Erreur de synchronisation");
    render();
  });
}

/* ---------- démarrage ---------- */
for (const k of Object.keys(STATUS)) $("addStatus").insertAdjacentHTML("beforeend", `<option value="${k}">${STATUS[k]}</option>`);
render();
try { fetch("covers.json").then((r) => (r.ok ? r.json() : null)).then((c) => { if (c && typeof c === "object") { covers = c; render(true); } }).catch(() => {}); } catch (e) {}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (api.current()) startApp(api.current()); else showAuth();
